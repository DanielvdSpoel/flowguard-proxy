apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowguard
  labels:
    app.kubernetes.io/name: flowguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: flowguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowguard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flowguard
      terminationGracePeriodSeconds: 30
      containers:
        - name: caddy
          image: flowguard-caddy
          env:
            # Host key from the FlowGuard control panel. All replicas share it.
            - name: FLOWGUARD_KEY
              valueFrom:
                secretKeyRef:
                  name: flowguard
                  key: key
            # Tells the replicas apart in the control panel and request logs.
            - name: FLOWGUARD_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Where allowed requests go, see the Caddyfile.
            - name: FLOWGUARD_UPSTREAM
              value: https://traefik-internal.traefik.svc.cluster.local:8443
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Let the ingress controller stop sending requests before Caddy
            # stops accepting them.
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            # The FlowGuard configuration, IP lists and IP database. An emptyDir
            # means each pod fetches them at startup, so the control panel must
            # be reachable for a pod to start.
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caddyfile
          configMap:
            name: flowguard-caddyfile
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flowguard
  labels:
    app.kubernetes.io/name: flowguard
spec:
  selector:
    app.kubernetes.io/name: flowguard
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: flowguard
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowguard
---
# FlowGuard trusts the X-Forwarded-For header of the networks in its
# trusted_proxies. Only let the ingress controller reach it, so no other pod in
# those networks can pick its own client IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowguard
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flowguard
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik # Your ingress controller's namespace
      ports:
        - port: http
    # Health checks come from the kubelet, which NetworkPolicies do not
    # restrict on most network plugins.
    - ports:
        - port: health
