name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "${unformatted}" ]; then
            echo "The following Go files are not formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Test transparent upstream networking
        run: ./bin/test-transparent-upstream.sh

      - name: Build
        run: go build -trimpath ./...

  caddy:
    name: Caddy plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: caddy

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: caddy/go.mod
          cache: true
          cache-dependency-path: caddy/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build Caddy with the plugin
        working-directory: .
        run: |
          go run github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7 build v2.11.7 \
            --output "${RUNNER_TEMP}/caddy" \
            --with go.chief.tools/flowguard-proxy/caddy=./caddy \
            --replace go.chief.tools/flowguard-proxy=.
          "${RUNNER_TEMP}/caddy" list-modules | grep -x http.handlers.flowguard

  caddy-image:
    name: Caddy image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the image from this checkout
        run: docker build -f caddy/Dockerfile -t flowguard-caddy:ci .

      - name: Check the plugin and the example Caddyfile
        run: |
          docker run --rm flowguard-caddy:ci caddy list-modules | grep -x http.handlers.flowguard
          # adapt parses the Caddyfile without starting FlowGuard, which would
          # need a real host key.
          docker run --rm -e FLOWGUARD_UPSTREAM=http://upstream:80 \
            -v "${PWD}/deploy/kubernetes/Caddyfile:/etc/caddy/Caddyfile:ro" \
            flowguard-caddy:ci caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
